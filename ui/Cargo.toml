[package]
name = "mukhomor-ui"
version = "0.8.1"
edition = "2024"
license = "MIT"
publish = false
description = "Portable Slint presentation layer for Mukhomor"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit", "slint/system-tray", "slint/raw-window-handle-06"]
android = ["slint/backend-android-activity-06"]
preview = ["dep:png"]

[dependencies]
serde_json = "=1.0.149"
png = { version = "=0.18.1", optional = true }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = "=1.18.1"

[[bin]]
name = "mukhomor-preview"
path = "src/preview.rs"
required-features = ["desktop", "preview"]

[package]
name = "mukhomor-tor"
version = "0.8.8"
edition = "2024"
license = "MIT"
description = "Isolated Tor transport for Mukhomor"

[features]
diagnostics = ["dep:tracing-subscriber"]

[dependencies]
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "static-sqlite", "pt-client"] }
tor-rtcompat = { version = "=0.47.0", features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
socket2 = { version = "0.6", features = ["all"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
saturating-time = "=0.5.0"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"

[patch.crates-io]
tor-chanmgr = { path = "../target/tor-sources/tor-chanmgr" }
saturating-time = { path = "../target/tor-sources/saturating-time" }
